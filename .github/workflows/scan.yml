name: Inside CPR Scanner

on:
  schedule:
    - cron: '30 10 * * 1-5'   # 4:00 PM IST weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance pandas Pillow

      - name: Run scanner
        env:
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT:   ${{ secrets.REPORT_RECIPIENT }}
        run: python scan.py

      - name: Commit exports and docs
        run: |
          git config user.name  "CPR Bot"
          git config user.email "cpr-bot@github-actions"
          mkdir -p exports docs history
          cp docs/cpr_list.json history/$(date -u +'%Y-%m-%d').json || true
          git add exports/ docs/ history/
          git diff --staged --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
