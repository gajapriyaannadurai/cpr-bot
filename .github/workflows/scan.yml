name: Inside CPR Scanner

on:
  schedule:
    # Multiple cron schedules to bypass GitHub Actions delay issues
    # All times in UTC. IST = UTC + 5:30
    - cron: '15 10 * * 1-5'   # 3:45 PM IST
    - cron: '30 10 * * 1-5'   # 4:00 PM IST
    - cron: '45 10 * * 1-5'   # 4:15 PM IST
    - cron: '0 11 * * 1-5'    # 4:30 PM IST
    - cron: '30 3 * * 1-5'    # 9:00 AM IST (morning backup before market opens)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance pandas Pillow

      - name: Check if already scanned today
        id: check
        run: |
          if [ -f "exports/cpr-watchlist.js" ]; then
            FILE_DATE=$(grep -oP 'Scan date: \K[0-9-]+' exports/cpr-watchlist.js || echo "none")
            TODAY=$(TZ='Asia/Kolkata' date +%Y-%m-%d)
            echo "File date: $FILE_DATE"
            echo "Today IST: $TODAY"
            if [ "$FILE_DATE" = "$TODAY" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Already scanned today — skipping"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run scanner
        if: steps.check.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scan.py

      - name: Commit exports
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "CPR Bot"
          git config user.email "cpr-bot@github-actions"
          git add exports/ 2>/dev/null || true
          git add history/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Scan export $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
